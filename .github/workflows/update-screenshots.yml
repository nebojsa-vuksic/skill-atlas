# Accepts an intended UI change (spec section 13.5): records every key moment on the CI runner,
# commits them as the new baselines to the branch, then runs CI on that commit.
name: Update screenshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines to update
        required: true

permissions:
  contents: write
  actions: write

jobs:
  update:
    # The same pinned image as the Demos job (spec 13.1).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: ./.github/actions/demo-setup
        with:
          voice: "false"

      - name: Record every key moment as a baseline
        run: ./gradlew demoTest --no-daemon -PupdateScreenshots

      - name: Commit the changed baselines
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrationTest/baselines
          if git diff --cached --quiet; then
            echo "Baselines are unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update screenshot baselines" -m "Recorded by the Update screenshots workflow on the CI runner (spec section 13.5)."
            git push origin "HEAD:${{ inputs.branch }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI on the new commit
        # Pushes made with GITHUB_TOKEN don't start workflows, but a dispatch does.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ inputs.branch }}"
