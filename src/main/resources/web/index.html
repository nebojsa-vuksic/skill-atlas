<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1><span class="badge">SKILL ATLAS</span></h1>
      <p class="tagline">List the agent skills defined in a GitHub repository.</p>
    </header>

    <form id="scan-form" autocomplete="off">
      <label for="url">GitHub repositories or organizations <span class="hint">(separate several with spaces or commas)</span></label>
      <div class="row">
        <input id="url" name="url" type="text" spellcheck="false"
               placeholder="https://github.com/owner/repo">
        <button id="scan-button" type="submit">Scan</button>
      </div>
    </form>
    <div id="repo-chips" class="chips" aria-label="Repositories" hidden></div>

    <p id="status" class="status" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="status-text"></span></p>
    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" hidden>
      <table id="repo-table" class="repo-table" hidden>
        <thead><tr><th>Repository</th><th>Description</th><th>Commit</th><th>Skills</th></tr></thead>
        <tbody id="repo-rows"></tbody>
      </table>
      <ul id="owner-lines" class="owner-lines" hidden></ul>

      <dl id="repository" class="repository">
        <dt>Repository</dt>
        <dd><a id="repo-name" class="repo-name" target="_blank" rel="noopener noreferrer"></a></dd>
        <dt>Description</dt>
        <dd id="repo-description" class="repo-description"></dd>
        <dt>Commit</dt>
        <dd><code id="commit" class="commit"></code> <span id="branch" class="branch"></span></dd>
      </dl>

      <h2 id="skill-count" class="skill-count"></h2>

      <div id="split" class="split">
        <div id="list-pane" class="list-pane">
          <div class="filter">
            <span class="filter-icon" aria-hidden="true">🔍</span>
            <input id="filter" class="filter-input" type="search" placeholder="Filter skills"
                   aria-label="Filter skills" aria-controls="skills" spellcheck="false" autocomplete="off">
            <button id="starred-only" class="starred-only" type="button" aria-pressed="false"
                    title="Show only starred skills" aria-label="Show only starred skills">★</button>
            <span id="filter-count" class="filter-count" aria-live="polite"></span>
          </div>
          <p id="no-match" class="no-match" hidden></p>
          <div id="skills" class="skills" role="listbox" aria-label="Skills"></div>
        </div>
        <div id="divider" class="divider" role="separator" tabindex="0"
             aria-orientation="vertical" aria-controls="list-pane" aria-label="Resize panes"></div>
        <article id="detail" class="detail" aria-live="polite">
          <header>
            <p id="detail-repo" class="detail-repo" hidden></p>
            <h2 id="detail-name" class="detail-name"></h2>
            <button id="star-button" class="star-button" type="button" aria-pressed="false" title="Star or unstar this skill (s)"></button>
            <p id="detail-description" class="detail-description"></p>
            <div id="detail-paths" class="detail-paths"></div>
            <a id="detail-github" class="github-link" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
          </header>
          <section id="similar" class="similar" aria-labelledby="similar-heading">
            <h3 id="similar-heading" class="similar-heading">Similar skills</h3>
            <div id="similar-list" class="similar-list"></div>
            <p id="no-similar" class="no-similar" hidden>No similar skills found.</p>
          </section>
          <div class="tabs" role="tablist" aria-label="Skill content">
            <button id="tab-rendered" class="tab" role="tab" type="button" aria-selected="true" aria-controls="rendered">Rendered</button>
            <button id="tab-raw" class="tab" role="tab" type="button" aria-selected="false" aria-controls="raw">Raw</button>
          </div>
          <div id="rendered" class="markdown" role="tabpanel" aria-labelledby="tab-rendered"></div>
          <pre id="raw" class="raw" role="tabpanel" aria-labelledby="tab-raw" hidden><code id="raw-code"></code></pre>
          <p id="no-content" class="no-content" hidden>(content not available)</p>
        </article>
      </div>

      <div id="ignored" class="ignored" hidden>
        <h3 id="ignored-heading"></h3>
        <ul id="ignored-list"></ul>
      </div>
    </section>
  </main>
</body>
</html>
